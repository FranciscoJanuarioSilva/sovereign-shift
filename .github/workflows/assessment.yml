name: Run migration assessment
on:
  workflow_dispatch:
    inputs:
      source:
        description: Inventory source
        type: choice
        options:
          - demo
          - aws
          - cloudflare
        default: demo
      use_ai:
        description: Enable configured OpenRouter suggestions
        type: boolean
        default: false
      publish_live_results:
        description: Share live assessment files with everyone who can read this repository
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Load synthetic inventory
        if: inputs.source == 'demo'
        run: |
          mkdir -p out
          cp testdata/clickops_inventory.json out/inventory.json
      - name: Scan AWS
        if: inputs.source == 'aws'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_READONLY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_READONLY_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_READONLY_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          : "${AWS_REGION:?Set AWS_REGION}" "${AWS_ACCESS_KEY_ID:?Set read-only credentials}" "${AWS_SECRET_ACCESS_KEY:?Set read-only credentials}"
          sovereign-shift scan --region "$AWS_REGION" --out out
      - name: Read Cloudflare Worker inventory
        if: inputs.source == 'cloudflare'
        env:
          CLOUDFLARE_MIGRATION_URL: ${{ vars.CLOUDFLARE_MIGRATION_URL }}
          MIGRATION_READ_KEY: ${{ secrets.MIGRATION_READ_KEY }}
        run: |
          : "${CLOUDFLARE_MIGRATION_URL:?Set the migration endpoint URL}" "${MIGRATION_READ_KEY:?Set the migration read key}"
          python - <<'PYSCAN'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          import httpx

          from sovereign_shift.artifacts import save
          from sovereign_shift.models import Inventory

          url = os.environ["CLOUDFLARE_MIGRATION_URL"]
          parsed = urlsplit(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.path != "/api/migration":
              raise SystemExit("Configure an HTTPS Worker migration endpoint")
          response = httpx.get(
              url, headers={"Authorization": "Bearer " + os.environ["MIGRATION_READ_KEY"]},
              follow_redirects=False, timeout=20,
          )
          if response.status_code != 200:
              raise SystemExit(f"Worker migration endpoint returned HTTP {response.status_code}")
          inventory = response.json()
          Inventory.model_validate(inventory)
          if inventory.get("source") != "cloudflare" or not any(
              resource["type"] == "cloudflare_worker" for resource in inventory["resources"]
          ):
              raise SystemExit("Endpoint returned no Cloudflare Worker inventory")
          save(Path("out"), "inventory", inventory)
          print("Read scoped Cloudflare Worker inventory")
          PYSCAN
      - name: Build assessment
        env:
          USE_AI: ${{ inputs.use_ai }}
          SOVEREIGN_AI_BASE_URL: ${{ vars.SOVEREIGN_AI_BASE_URL }}
          SOVEREIGN_AI_MODEL: ${{ vars.SOVEREIGN_AI_MODEL }}
          SOVEREIGN_AI_API_KEY: ${{ inputs.use_ai && secrets.SOVEREIGN_AI_API_KEY || '' }}
        run: |
          ai=(--no-ai)
          if [[ "$USE_AI" == true ]]; then
            : "${SOVEREIGN_AI_API_KEY:?Set OpenRouter secret}" "${SOVEREIGN_AI_MODEL:?Set AI model}" "${SOVEREIGN_AI_BASE_URL:?Set AI endpoint}"
            ai=()
          fi
          sovereign-shift all --from-snapshot out/inventory.json --out out "${ai[@]}"
      - name: Validate generated Terraform
        run: |
          terraform -chdir=out/terraform init -backend=false -input=false
          terraform -chdir=out/terraform validate
      - uses: actions/upload-artifact@v4
        if: inputs.source == 'demo' || inputs.publish_live_results
        with:
          name: migration-assessment-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          # only the masked copies, the account id never leaves the runner
          path: out/public/
