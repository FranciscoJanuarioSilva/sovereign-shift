name: Run migration assessment
on:
  workflow_dispatch:
    inputs:
      source:
        description: Inventory source
        type: choice
        options:
          - demo
          - aws
          - cloudflare-demo
          - cloudflare
        default: demo
      use_ai:
        description: Enable configured OpenRouter suggestions
        type: boolean
        default: false
      publish_live_results:
        description: Share live assessment files with everyone who can read this repository
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Load synthetic inventory
        if: inputs.source == 'demo'
        run: |
          mkdir -p out
          cp testdata/clickops_inventory.json out/inventory.json
      - name: Scan AWS
        if: inputs.source == 'aws'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_READONLY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_READONLY_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_READONLY_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          : "${AWS_REGION:?Set AWS_REGION}" "${AWS_ACCESS_KEY_ID:?Set read-only credentials}" "${AWS_SECRET_ACCESS_KEY:?Set read-only credentials}"
          sovereign-shift scan --region "$AWS_REGION" --out out
      - name: Load synthetic Cloudflare inventory
        if: inputs.source == 'cloudflare-demo'
        run: |
          mkdir -p out
          cp examples/cloudflare-worker/sample_snapshot.json out/inventory.json
      - name: Scan Cloudflare
        if: inputs.source == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}" "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          python - <<'PYSCAN'
          from pathlib import Path
          from sovereign_shift.artifacts import save
          from sovereign_shift.scanner.cloudflare import scan

          inventory = scan()
          if any("/workers/scripts" in operation["operation"] for operation in inventory["denied"]):
              raise SystemExit("Cloudflare denied access to Worker scripts, settings or schedules")
          if not any(resource["type"] == "cloudflare_worker" for resource in inventory["resources"]):
              raise SystemExit("Cloudflare returned no Workers for the configured account")
          save(Path("out"), "inventory", inventory)
          print("Read Cloudflare Workers inventory")
          PYSCAN
      - name: Build assessment
        env:
          USE_AI: ${{ inputs.use_ai }}
          SOVEREIGN_AI_BASE_URL: ${{ vars.SOVEREIGN_AI_BASE_URL }}
          SOVEREIGN_AI_MODEL: ${{ vars.SOVEREIGN_AI_MODEL }}
          SOVEREIGN_AI_API_KEY: ${{ inputs.use_ai && secrets.SOVEREIGN_AI_API_KEY || '' }}
        run: |
          ai=(--no-ai)
          if [[ "$USE_AI" == true ]]; then
            : "${SOVEREIGN_AI_API_KEY:?Set OpenRouter secret}" "${SOVEREIGN_AI_MODEL:?Set AI model}" "${SOVEREIGN_AI_BASE_URL:?Set AI endpoint}"
            ai=()
          fi
          sovereign-shift all --from-snapshot out/inventory.json --out out "${ai[@]}"
      - name: Validate generated Terraform
        run: |
          terraform -chdir=out/terraform init -backend=false -input=false
          terraform -chdir=out/terraform validate
      - uses: actions/upload-artifact@v4
        if: inputs.source == 'demo' || inputs.source == 'cloudflare-demo' || inputs.publish_live_results
        with:
          name: migration-assessment-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          # only the masked copies, the account id never leaves the runner
          path: out/public/
