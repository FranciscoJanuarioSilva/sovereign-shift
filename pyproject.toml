[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-shift"
version = "0.1.0"
description = "Assess AWS ClickOps migrations to Leaseweb"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2,<4", "typer>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sovereign-shift = "sovereign_shift.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
