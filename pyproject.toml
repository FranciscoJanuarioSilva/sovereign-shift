[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-shift"
version = "0.1.0"
description = "Assess AWS ClickOps migrations to Leaseweb"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "networkx>=3.2,<4", "typer>=0.12,<1", "pydantic>=2,<3", "jinja2>=3.1", "pyyaml>=6", "httpx>=0.27", "openai>=1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sovereign-shift = "sovereign_shift.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"runbook/templates" = "sovereign_shift/runbook/templates"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "SIM"]
# typer options are declared as defaults, that's how typer works
ignore = ["B008"]
