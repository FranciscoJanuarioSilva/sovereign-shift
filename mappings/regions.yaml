# aws region -> leaseweb public cloud region
# leaseweb reuses aws-style codes but they are different places, never copy the string
# all ten leaseweb codes below were confirmed with GET /regions on 2026-11-20
# the terraform provider (1.32.1) only accepts eight of them, see provider_accepts and docs/schemas/leaseweb.json
aws_to_leaseweb:
  eu-west-1: eu-west-3       # dublin -> amsterdam
  eu-west-2: eu-west-3       # london -> amsterdam (uk isn't eu, override with --target-region eu-west-2)
  eu-west-3: eu-west-3       # paris -> amsterdam, no paris dc
  eu-central-1: eu-central-1 # frankfurt -> frankfurt
  eu-central-2: eu-central-1 # zurich -> frankfurt
  eu-north-1: eu-west-3      # stockholm -> amsterdam
  eu-south-1: eu-central-1   # milan -> frankfurt
  eu-south-2: eu-central-1   # spain -> frankfurt
  us-east-1: us-east-1
  us-east-2: us-east-1
  us-west-1: us-west-1
  us-west-2: us-west-1       # the provider (1.32.1) rejects us-west-2 (los angeles)
  ca-central-1: ca-central-1
  ap-southeast-1: ap-southeast-1
  ap-northeast-1: ap-northeast-1
  ap-southeast-2: ap-southeast-1 # sydney -> singapore, the provider (1.32.1) rejects ap-southeast-2
# google cloud region (or multi-region bucket location) -> leaseweb, same nearest-dc logic as aws
# picked when the inventory source is gcp
# locations per https://cloud.google.com/compute/docs/regions-zones (2026-11-20)
gcp_to_leaseweb:
  europe-west1: eu-west-3       # belgium -> amsterdam
  europe-west2: eu-west-3       # london -> amsterdam (uk isn't eu, override with --target-region eu-west-2)
  europe-west3: eu-central-1    # frankfurt -> frankfurt
  europe-west4: eu-west-3       # netherlands -> amsterdam
  europe-west6: eu-central-1    # zurich -> frankfurt
  europe-west8: eu-central-1    # milan -> frankfurt
  europe-west9: eu-west-3       # paris -> amsterdam
  europe-west10: eu-central-1   # berlin -> frankfurt
  europe-west12: eu-central-1   # turin -> frankfurt
  europe-north1: eu-west-3      # finland -> amsterdam
  europe-north2: eu-west-3      # stockholm -> amsterdam
  europe-central2: eu-central-1 # warsaw -> frankfurt
  europe-southwest1: eu-central-1 # madrid -> frankfurt
  us-central1: us-east-1
  us-east1: us-east-1
  us-east4: us-east-1
  us-east5: us-east-1
  us-west1: us-west-1
  us-west2: us-west-1           # the provider (1.32.1) rejects us-west-2 (los angeles)
  us-west3: us-west-1
  us-west4: us-west-1
  northamerica-northeast1: ca-central-1
  northamerica-northeast2: ca-central-1
  asia-southeast1: ap-southeast-1
  asia-northeast1: ap-northeast-1
  asia-northeast2: ap-northeast-1
  australia-southeast1: ap-southeast-1
  eu: eu-west-3                 # multi-region buckets
  eur4: eu-west-3
  us: us-east-1
  asia: ap-southeast-1
default: eu-west-3

leaseweb_codes:
  eu-west-3: {location: Amsterdam, country: nl, currency: EUR, verified: true}
  eu-central-1: {location: Frankfurt, country: de, currency: EUR, verified: true}
  eu-west-2: {location: London, country: uk, currency: GBP, verified: true}
  us-east-1: {location: Washington, country: us, currency: USD, verified: true}
  us-west-1: {location: San Francisco, country: us, currency: USD, verified: true}
  us-west-2: {location: Los Angeles, country: us, currency: USD, verified: true, provider_accepts: false}
  ca-central-1: {location: Montreal, country: ca, currency: CAD, verified: true}
  ap-southeast-1: {location: Singapore, country: sg, currency: SGD, verified: true}
  ap-southeast-2: {location: Sydney, country: au, currency: AUD, verified: true, provider_accepts: false}
  ap-northeast-1: {location: Japan, country: jp, currency: JPY, verified: true}

# s3-compatible object storage endpoint per country
# source: kb.leaseweb.com object storage getting started, 2026-11-20
object_storage_endpoints:
  nl: https://nl.object-storage.io
  de: https://de.object-storage.io
  uk: https://uk.object-storage.io
  us: https://us.object-storage.io
  ca: https://ca.object-storage.io
  sg: https://sg.object-storage.io

# azure region -> leaseweb public cloud region (only regions the provider accepts)
azure_to_leaseweb:
  swedencentral: eu-west-3      # sweden -> amsterdam
  westeurope: eu-west-3         # netherlands -> amsterdam
  northeurope: eu-west-3        # ireland -> amsterdam
  francecentral: eu-west-3      # paris -> amsterdam
  germanywestcentral: eu-central-1  # frankfurt -> frankfurt
  switzerlandnorth: eu-central-1
  italynorth: eu-central-1
  uksouth: eu-west-3            # london -> amsterdam (override with --target-region eu-west-2)
  eastus: us-east-1
  eastus2: us-east-1
  westus: us-west-1
  westus2: us-west-1
  canadacentral: ca-central-1
  southeastasia: ap-southeast-1
  japaneast: ap-northeast-1
